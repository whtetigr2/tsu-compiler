name: number_partition
description: >
  Classic number-partition Ising / QUBO (finance & scheduling sibling).
  Real problem: bipartition the integer set {1, 3, 4, 5, 7, 8} so the two
  subset sums are as equal as possible (total 28 → ideal half 14). Energy is
  the squared deviation (sum_i s_i x_i − 14)^2 expanded as a Product of two
  identical linear forms — the textbook Ising formulation of NUMBER PARTITION.
  Sibling of portfolio long/short and load-balancing splits a Z1 owner already
  meets in scheduling. Soft weight keeps |b|/|J| inside Z1 assumed caps.
variables:
  x0: {domain: binary}
  x1: {domain: binary}
  x2: {domain: binary}
  x3: {domain: binary}
  x4: {domain: binary}
  x5: {domain: binary}
terms:
  # (1*x0 + 3*x1 + 4*x2 + 5*x3 + 7*x4 + 8*x5 - 14)^2
  - {kind: product,
     a: {x0: 1.0, x1: 3.0, x2: 4.0, x3: 5.0, x4: 7.0, x5: 8.0, const: -14.0},
     b: {x0: 1.0, x1: 3.0, x2: 4.0, x3: 5.0, x4: 7.0, x5: 8.0, const: -14.0},
     weight: 0.12}
contract:
  validate: []
