name: adjacency_4x4_k4
description: >
  The same adjacency-constrained value-assignment workload as
  adjacency_2x2_k3.yaml (see that file for the full explanation of the
  generic mechanisms used -- `grid`/A1, `product_over_edges`/A2,
  `forbid_value_pair_over_edges`/A3), scaled to a 4x4 grid with k=4.

  Domain story, for intuition only, kept out of src/: value 0 is "water",
  value 1 is "shore", value 2 is "mountain", value 3 is "peak". Water must
  never sit directly next to mountain OR peak without a shore tile between.

  This instance is deliberately BEYOND exact enumeration: domain-wall gives 48
  spins (2^48 states), one-hot gives 64 spins (2^64 states), both far past
  thrml_backend.EXACT_LIMIT (18). The exact-layer verification fields (energy
  equivalence, sampled-vs-exact TV, torx cross-check) must honestly read
  `unavailable: 2^n too large to enumerate` for this instance -- there is no
  way around that, and the compiler must say so rather than guess. The TASK
  layer still works fully, because task validity is measured on DECODED
  SAMPLES against the original contract rules and needs no enumeration at
  all. That contrast -- exact layers honestly blind, task layer still seeing
  clearly -- is the entire point of including this instance.
generate:
  kind: grid
  width: 4
  height: 4
  variable_domain: {domain: categorical, k: 4}
terms:
  - {kind: product_over_edges, a_value: 0, b_value: 2, weight: 4.0}
  - {kind: product_over_edges, a_value: 0, b_value: 3, weight: 4.0}
contract:
  validate:
    - {rule: forbid_value_pair_over_edges, a_value: 0, b_value: 2,
       message: "value 0 directly adjacent to value 2 with no buffer between"}
    - {rule: forbid_value_pair_over_edges, a_value: 0, b_value: 3,
       message: "value 0 directly adjacent to value 3 with no buffer between"}
