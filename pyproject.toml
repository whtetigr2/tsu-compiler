[project]
name = "tsu"
version = "0.1.0"
description = "Will your model fit thermodynamic sampling hardware, and at what coupling should it be sampled -- with receipts for every number."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Paul Shaver" }]
keywords = ["ising", "thermodynamic-computing", "compiler", "gibbs-sampling", "ebm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Compilers",
]
dependencies = ["numpy", "networkx", "sympy", "pyyaml", "thrml", "extro-torx"]

[project.scripts]
tsu = "tsu.cli:main"

[build-system]
requires = ["setuptools>=77"]  # >=77 for PEP 639 license/license-files
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: exercises a real (tiny) thrml sampling run rather than synthetic fixtures -- excluded by 'pytest -m \"not slow\"' for a fast default loop.",
]
