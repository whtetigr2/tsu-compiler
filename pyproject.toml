[project]
name = "tsu"
version = "0.1.0"
description = "Semantic and hardware-aware compilation for thermodynamic sampling units"
requires-python = ">=3.11"
dependencies = ["numpy", "networkx", "sympy", "pyyaml", "thrml", "extro-torx"]

[project.scripts]
tsu = "tsu.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
